<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJTT 후기 관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 800px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    label { font-size: 13px; font-weight: 600; color: #666; display: block; margin-bottom: 8px; }
    input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: #333; }
    .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.8; }
    .btn-primary { background: #222; color: #fff; }
    .btn-success { background: #2ecc71; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; font-size: 12px; padding: 6px 12px; }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; }
    #preview { display: none; border: 1px solid #eee; border-radius: 10px; overflow: hidden; margin-top: 16px; }
    #preview img { width: 100%; height: 180px; object-fit: cover; }
    #preview .preview-body { padding: 14px; }
    #preview .preview-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    #preview .preview-desc { font-size: 12px; color: #888; line-height: 1.5; }
    .review-list { display: flex; flex-direction: column; gap: 12px; }
    .review-item { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .review-item img { width: 80px; height: 60px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #eee; }
    .review-info { flex: 1; min-width: 0; }
    .review-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .review-url { font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .review-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
    .badge-on { background: #e8f8f0; color: #2ecc71; }
    .badge-off { background: #fee; color: #e74c3c; }
    .toggle-btn { font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
    .status-msg { font-size: 13px; margin-top: 10px; padding: 10px 14px; border-radius: 8px; display: none; }
    .status-ok { background: #e8f8f0; color: #27ae60; }
    .status-err { background: #fee; color: #e74c3c; }
    .empty { text-align: center; color: #aaa; font-size: 14px; padding: 32px; }
  </style>
</head>
<body>
<div class="container">
  <h1>📝 JJTT 후기 관리</h1>

  <!-- URL 입력 -->
  <div class="card">
    <label>블로그 URL 입력</label>
    <input type="text" id="urlInput" placeholder="https://blog.naver.com/..." />
    <div class="btn-row">
      <button class="btn btn-primary" onclick="fetchOG()">미리보기</button>
    </div>

    <!-- 미리보기 -->
    <div id="preview">
      <img id="prevImg" src="" alt="썸네일" onerror="this.style.display='none'">
      <div class="preview-body">
        <div class="preview-title" id="prevTitle"></div>
        <div class="preview-desc" id="prevDesc"></div>
      </div>
    </div>

    <div class="btn-row" id="saveRow" style="display:none">
      <button class="btn btn-success" onclick="saveReview()">저장하기</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <!-- 후기 목록 -->
  <div class="card">
    <label>등록된 후기 목록</label>
    <div class="review-list" id="reviewList">
      <div class="empty">불러오는 중...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://pvzmmwmvlladykasifve.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2em1td212bGxhZHlrYXNpZnZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNzYwOTMsImV4cCI6MjA4Njc1MjA5M30.n3VDV0gYpsR5g4aVd_v_MY92LP4QE5tIQ-TiJVZUaC4';
  const VERCEL_URL = 'https://jjtt-webhook.vercel.app';

  let ogData = {};

  async function fetchOG() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return alert('URL을 입력해주세요');

    showStatus('', '');
    document.getElementById('preview').style.display = 'none';
    document.getElementById('saveRow').style.display = 'none';

    try {
      const res = await fetch(`${VERCEL_URL}/api/fetch-og?url=${encodeURIComponent(url)}`);
      const data = await res.json();

      ogData = { ...data, blog_url: url };

      document.getElementById('prevImg').src = data.thumbnail_url || '';
      document.getElementById('prevTitle').textContent = data.title || '(제목 없음)';
      document.getElementById('prevDesc').textContent = data.description || '';
      document.getElementById('preview').style.display = 'block';
      document.getElementById('saveRow').style.display = 'flex';
    } catch (e) {
      showStatus('페이지를 불러올 수 없어요. URL을 확인해주세요.', 'err');
    }
  }

  async function saveReview() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/reviews`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(ogData)
    });

    if (res.ok) {
      showStatus('저장 완료! ✅', 'ok');
      document.getElementById('urlInput').value = '';
      document.getElementById('preview').style.display = 'none';
      document.getElementById('saveRow').style.display = 'none';
      loadReviews();
    } else {
      showStatus('저장 실패. 다시 시도해주세요.', 'err');
    }
  }

  async function loadReviews() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/reviews?order=created_at.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    const list = document.getElementById('reviewList');

    if (!data.length) {
      list.innerHTML = '<div class="empty">등록된 후기가 없어요</div>';
      return;
    }

    list.innerHTML = data.map(r => `
      <div class="review-item" id="item-${r.id}">
        <img src="${r.thumbnail_url || ''}" alt="썸네일" onerror="this.style.background='#eee'">
        <div class="review-info">
          <div class="review-title">${r.title || '(제목 없음)'}</div>
          <div class="review-url">${r.blog_url}</div>
          <span class="badge ${r.is_visible ? 'badge-on' : 'badge-off'}">${r.is_visible ? '노출 중' : '숨김'}</span>
        </div>
        <div class="review-actions">
          <button class="toggle-btn" onclick="toggleVisible('${r.id}', ${r.is_visible})">${r.is_visible ? '숨기기' : '노출'}</button>
          <button class="btn btn-danger" onclick="deleteReview('${r.id}')">삭제</button>
        </div>
      </div>
    `).join('');
  }

  async function toggleVisible(id, current) {
    await fetch(`${SUPABASE_URL}/rest/v1/reviews?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({ is_visible: !current })
    });
    loadReviews();
  }

  async function deleteReview(id) {
    if (!confirm('정말 삭제할까요?')) return;
    await fetch(`${SUPABASE_URL}/rest/v1/reviews?id=eq.${id}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    loadReviews();
  }

  function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = `status-msg ${type === 'ok' ? 'status-ok' : 'status-err'}`;
    el.style.display = msg ? 'block' : 'none';
  }

  loadReviews();
</script>
</body>
</html>
