<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JJTT 기부 나무</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f5f0e8;font-family:'Noto Sans KR',sans-serif}
.page{max-width:960px;margin:0 auto;padding:24px 16px 48px}
.hd{text-align:center;margin-bottom:16px}
.hd-tag{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3em;color:#8a6a2a;border:1px solid rgba(138,106,42,.3);padding:5px 14px;margin-bottom:10px}
.hd-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.05em;color:#2a2018}
.hd-sub{font-size:12px;color:rgba(42,32,24,.48);margin-top:5px;letter-spacing:.03em}

.scene{background:white;border-radius:16px;overflow:hidden;box-shadow:0 6px 32px rgba(0,0,0,.1)}
#sv{width:100%;display:block}

/* 나무 레이블 — SVG 밖 HTML */
.tree-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tree-label{text-align:center;background:white;border-radius:10px;padding:10px 6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tl-name{font-size:12px;font-weight:500;color:#2a2018;line-height:1.4}
.tl-cnt{font-family:'DM Mono',monospace;font-size:13px;color:rgba(42,32,24,.5);margin-top:4px;letter-spacing:.04em}
@media(max-width:400px){.tree-labels{grid-template-columns:repeat(2,1fr)}}

.total-bar{display:flex;justify-content:center;align-items:baseline;gap:6px;margin-top:12px;font-family:'DM Mono',monospace;font-size:11px;color:rgba(42,32,24,.5);letter-spacing:.08em}
.total-bar strong{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#2a2018;letter-spacing:.03em}
.share-btn{display:block;width:100%;margin-top:12px;padding:12px;background:white;border:1px solid rgba(138,106,42,.2);border-radius:10px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:#8a6a2a;cursor:pointer;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:background .2s}
.share-btn:hover{background:#faf8f2}
.share-btn.ok{background:#f0f8ec;color:#4a7a30;border-color:rgba(74,122,48,.3)}
.ft{text-align:center;margin-top:16px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:rgba(42,32,24,.28)}

@keyframes charSway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(1.8deg)}}
.char-body{transform-box:fill-box;transform-origin:50% 100%;animation:charSway var(--sw,3.5s) ease-in-out infinite var(--sd,0s)}

@keyframes flyInL{0%{opacity:0;transform:translate(-50px,24px) scale(.48)}65%{opacity:1;transform:translate(3px,-3px) scale(1.05)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes flyInR{0%{opacity:0;transform:translate(50px,24px) scale(.48)}65%{opacity:1;transform:translate(-3px,-3px) scale(1.05)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes flyInT{0%{opacity:0;transform:translate(0,-46px) scale(.48)}65%{opacity:1;transform:translate(0,4px) scale(1.05)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.bird-g{animation-duration:.88s;animation-timing-function:cubic-bezier(.34,1.56,.64,1);animation-fill-mode:both}
.fl{animation-name:flyInL}.fr{animation-name:flyInR}.ft2{animation-name:flyInT}
.bird-bd{animation:bob var(--bd,3s) ease-in-out infinite var(--dd,0s)}
</style>
</head>

<!-- 나무 레이블 — HTML (모바일 가독성) -->
<div class="tree-labels">
  <div class="tree-label"><div class="tl-name">취약계층 아동·노인</div><div class="tl-cnt" id="lb1">0켤레</div></div>
  <div class="tree-label"><div class="tl-name">소방·구급대</div><div class="tl-cnt" id="lb2">0켤레</div></div>
  <div class="tree-label"><div class="tl-name">노숙인</div><div class="tl-cnt" id="lb3">0켤레</div></div>
  <div class="tree-label"><div class="tl-name">사회복지사</div><div class="tl-cnt" id="lb4">0켤레</div></div>
</div>

<div class="total-bar">
  <strong id="total-cnt">0</strong>켤레 함께 적립 중
</div>
<button class="share-btn" id="share-btn" onclick="copyLink()">🔗 &nbsp; 링크 복사해서 공유하기</button>
<div class="ft">JJTT — BUY ONE GIVE ONE &nbsp;·&nbsp; jacktweet.com</div>
</div>

<script>
const API='https://jjtt-webhook.vercel.app/api/status';

// 밝고 생기 있는 색상 팔레트
const PAL=[
  '#FF5252','#FF8C42','#FFCA3A','#6BCB77',
  '#4D96FF','#C77DFF','#FF6B9D','#00C9A7',
  '#FF595E','#56CFE1','#9B5DE5','#F15BB5',
  '#FEE440','#00BBF9','#00F5D4','#FF7F51'
];

// 크라운 전체에 분산된 퍼치 위치
const PERCHES={
  // T1 포플러: 꼭대기~하단 전체
  cat1:[
    {x:113,y:82},  {x:80,y:110},  {x:148,y:108},
    {x:60,y:165},  {x:165,y:158}, {x:100,y:148},
    {x:78,y:218},  {x:148,y:225}, {x:100,y:260},
    {x:130,y:268}
  ],
  // T2 참나무: 넓은 크라운 전체
  cat2:[
    {x:315,y:168}, {x:288,y:185}, {x:355,y:180},
    {x:210,y:238}, {x:430,y:235}, {x:322,y:220},
    {x:250,y:265}, {x:392,y:258}, {x:210,y:285},
    {x:440,y:278}
  ],
  // T3 비대칭: 오른쪽 무거운 쪽 중심 + 왼쪽 일부
  cat3:[
    {x:455,y:215}, {x:500,y:205},
    {x:575,y:158}, {x:605,y:172},
    {x:638,y:150}, {x:665,y:162},
    {x:682,y:158}, {x:718,y:170},
    {x:742,y:158}, {x:710,y:192}
  ],
  // T4 쌍봉: 왼쪽봉 5개 + 오른쪽봉 5개
  cat4:[
    {x:718,y:158}, {x:688,y:185}, {x:748,y:178},
    {x:668,y:220}, {x:726,y:235},
    {x:800,y:155}, {x:770,y:183}, {x:830,y:178},
    {x:858,y:215}, {x:805,y:232}
  ]
};

const LB={cat1:'lb1',cat2:'lb2',cat3:'lb3',cat4:'lb4'};
function birdN(n){return Math.min(10,Math.floor(n/10));}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}

function bodyPaths(t,c){
  if(t==='B')return`<path d="M-16,2 L-26,-2 L-24,6Z" fill="${c}" opacity=".85"/><ellipse cx="0" cy="0" rx="11" ry="7" fill="${c}"/><circle cx="13" cy="-5" r="7" fill="${c}"/><path d="M18,-4.5 L25,-3 L18,-1.5Z" fill="#8B5E3C"/><circle cx="14.5" cy="-6.5" r="2" fill="white"/><circle cx="15" cy="-6.8" r="1" fill="#111"/><path d="M-5,-4 Q3,-13 11,-4" stroke="rgba(255,255,255,.35)" stroke-width="1.8" fill="none"/><path d="M-1,7 L-3,13 M-1,7 L1,13 M3,7 L1,13 M3,7 L5,13" stroke="#8B5E3C" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  if(t==='C')return`<path d="M-13,4 L-21,-2 L-20,8Z" fill="${c}" opacity=".87"/><ellipse cx="0" cy="0" rx="15" ry="11" fill="${c}"/><circle cx="16" cy="-6" r="9" fill="${c}"/><path d="M22,-5.5 L29,-4 L22,-2.5Z" fill="#8B5E3C"/><circle cx="17.5" cy="-7.5" r="2.5" fill="white"/><circle cx="18" cy="-7.8" r="1.2" fill="#111"/><circle cx="18.8" cy="-8.4" r=".5" fill="white"/><path d="M-3,-6 Q5,-16 14,-6" stroke="rgba(255,255,255,.35)" stroke-width="2.2" fill="none"/><path d="M-1,11 L-3,17 M-1,11 L1,17 M4,11 L2,17 M4,11 L6,17" stroke="#8B5E3C" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  return`<path d="M-14,3 L-23,-2 L-21,7Z" fill="${c}" opacity=".86"/><ellipse cx="0" cy="0" rx="13" ry="9" fill="${c}"/><circle cx="14" cy="-6" r="8" fill="${c}"/><path d="M20,-5.5 L27,-4 L20,-2.5Z" fill="#8B5E3C"/><circle cx="15.5" cy="-7.5" r="2.2" fill="white"/><circle cx="16" cy="-7.8" r="1.1" fill="#111"/><circle cx="16.8" cy="-8.4" r=".5" fill="white"/><path d="M-4,-5 Q4,-14 12,-5" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none"/><path d="M-1,9 L-3,15 M-1,9 L1,15 M3,9 L1,15 M3,9 L5,15" stroke="#8B5E3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
}

function makeBird(x,y,delay){
  const color=rnd(PAL),type=rnd(['A','A','B','C']),s=(0.52+Math.random()*0.18).toFixed(2);
  const flip=Math.random()>.5,fx=flip?-1:1,dir=rnd(['fl','fl','fr','ft2']);
  const yOff=Math.round(15*s),bd=(2.2+Math.random()*2.2).toFixed(1),dd=(Math.random()*1.8).toFixed(1);
  return`<g class="bird-g ${dir}" style="animation-delay:${delay}s"><g transform="translate(${x},${y-yOff}) scale(${fx*s},${s})"><g class="bird-bd" style="--bd:${bd}s;--dd:${dd}s">${bodyPaths(type,color)}</g></g></g>`;
}

function makePerch(x,y){return`<circle cx="${x}" cy="${y-3}" r="3" fill="none" stroke="#9a8060" stroke-width=".8" opacity=".15"/>`;}

function render(data){
  let birds='',dots='',delay=0,totalCnt=0;
  for(const[key,perches]of Object.entries(PERCHES)){
    const cnt=(data[key]||{}).count||0,n=birdN(cnt);
    totalCnt+=cnt;
    const el=document.getElementById(LB[key]);
    if(el)el.textContent=`${cnt.toLocaleString()}켤레`;
    for(let i=0;i<10;i++){
      const p=perches[i];
      if(i<n){birds+=makeBird(p.x,p.y,delay);delay+=0.10;}
      else{dots+=makePerch(p.x,p.y);}
    }
  }
  document.getElementById('birds').innerHTML=birds;
  document.getElementById('dots').innerHTML=dots;
  const el=document.getElementById('total-cnt'),t0=performance.now(),dur=1500;
  const tick=now=>{const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=Math.floor(e*totalCnt).toLocaleString();if(p<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}

function copyLink(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const b=document.getElementById('share-btn');
    b.textContent='✓  복사되었습니다!';b.classList.add('ok');
    setTimeout(()=>{b.textContent='🔗 \u00a0 링크 복사해서 공유하기';b.classList.remove('ok');},2200);
  });
}

async function load(){
  let data={cat1:{count:0},cat2:{count:0},cat3:{count:0},cat4:{count:0}};
  try{const r=await fetch(API);const j=await r.json();if(j.success){data={};for(const[k,v]of Object.entries(j.data))data[k]={count:v.count||0};}}catch(e){console.warn('API 실패');}
  render(data);
}
load();
</script>
