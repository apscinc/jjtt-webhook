<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JJTT 기부 나무</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f5f0e8;font-family:'Noto Sans KR',sans-serif}
.page{max-width:620px;margin:0 auto;padding:28px 16px 48px}

.hd{text-align:center;margin-bottom:18px}
.hd-tag{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3em;color:#8a6a2a;border:1px solid rgba(138,106,42,.3);padding:5px 14px;margin-bottom:10px}
.hd-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.05em;color:#2a2018}
.hd-sub{font-size:12px;color:rgba(42,32,24,.48);margin-top:5px;letter-spacing:.03em}

.total-bar{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-bottom:18px;font-family:'DM Mono',monospace;font-size:11px;color:rgba(42,32,24,.5);letter-spacing:.08em}
.total-bar strong{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#2a2018;letter-spacing:.03em}

.tree-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tree-card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 18px rgba(0,0,0,.08)}
.tree-card svg{width:100%;display:block}
.tree-info{padding:10px 14px 13px;display:flex;align-items:center;gap:8px}
.t-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.t-name{font-size:11px;font-weight:500;color:#2a2018;line-height:1.3}
.t-cnt{font-family:'DM Mono',monospace;font-size:10px;color:rgba(42,32,24,.42);margin-top:2px}

.share-btn{display:block;width:100%;margin-top:12px;padding:12px;background:white;border:1px solid rgba(138,106,42,.2);border-radius:10px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:#8a6a2a;cursor:pointer;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:background .2s}
.share-btn:hover{background:#faf8f2}
.share-btn.ok{background:#f0f8ec;color:#4a7a30;border-color:rgba(74,122,48,.3)}
.ft{text-align:center;margin-top:18px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:rgba(42,32,24,.28)}

@keyframes flyIn{0%{opacity:0;transform:translate(-42px,20px) scale(.5)}65%{opacity:1;transform:translate(3px,-3px) scale(1.04)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(1deg)}}
.bird-g{animation:flyIn .85s cubic-bezier(.34,1.56,.64,1) both}
.bird-bd{animation:bob var(--bd,3s) ease-in-out infinite var(--dd,0s)}
</style>
</head>
<body>
<div class="page">

<div class="hd">
  <div class="hd-tag">JJTT — GIVING TREE</div>
  <div class="hd-title">함께 채워가는 나무</div>
  <div class="hd-sub">10켤레당 새 한 마리 · 나무당 최대 10마리</div>
</div>

<div class="total-bar">
  <strong id="total-cnt">0</strong>켤레 적립 &nbsp;·&nbsp; <strong id="total-birds">0</strong>마리 자리함
</div>

<div class="tree-grid" id="tree-grid"></div>

<button class="share-btn" id="share-btn" onclick="copyLink()">🔗 &nbsp; 링크 복사해서 공유하기</button>
<div class="ft">JJTT — BUY ONE GIVE ONE &nbsp;·&nbsp; jacktweet.com</div>
</div>

<script>
const API='https://jjtt-webhook.vercel.app/api/status';

const CATS={
  cat1:{color:'#4a95c0',name:'취약계층 아동·노인'},
  cat2:{color:'#d96030',name:'소방·구급대'},
  cat3:{color:'#3ea060',name:'노숙인'},
  cat4:{color:'#9f4eb8',name:'사회복지사'}
};

const PERCHES=[
  {x:104,y:175},{x:79,y:161},{x:55,y:146},{x:33,y:131},{x:18,y:117},
  {x:156,y:172},{x:181,y:158},{x:205,y:145},{x:227,y:130},{x:242,y:116}
];

function birdN(n){return Math.min(10,Math.floor(n/10));}

function makeBird(x,y,color,delay,flip){
  const s=0.60,fx=flip?-1:1,yOff=Math.round(15*s);
  const bd=(2.4+Math.random()*2).toFixed(1);
  const dd=(Math.random()*1.5).toFixed(1);
  return `<g class="bird-g" style="animation-delay:${delay}s">
<g transform="translate(${x},${y-yOff}) scale(${fx*s},${s})">
<g class="bird-bd" style="--bd:${bd}s;--dd:${dd}s">
<path d="M-14,3 L-23,-2 L-21,7Z" fill="${color}" opacity=".82"/>
<ellipse cx="0" cy="0" rx="13" ry="9" fill="${color}"/>
<circle cx="14" cy="-6" r="8" fill="${color}"/>
<path d="M20,-5.5 L27,-4 L20,-2.5Z" fill="#8B5E3C"/>
<circle cx="15.5" cy="-7.5" r="2.2" fill="white"/>
<circle cx="16" cy="-7.8" r="1.1" fill="#111"/>
<circle cx="16.8" cy="-8.4" r=".5" fill="white"/>
<path d="M-4,-5 Q4,-14 12,-5" stroke="rgba(255,255,255,.3)" stroke-width="2" fill="none"/>
<path d="M-1,9 L-3,15 M-1,9 L1,15" stroke="#8B5E3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<path d="M3,9 L1,15 M3,9 L5,15" stroke="#8B5E3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</g></g></g>`;
}

function makePerch(x,y){
  return `<circle cx="${x}" cy="${y-3}" r="2.5" fill="none" stroke="#9a8060" stroke-width=".8" opacity=".2"/>`;
}

function buildTree(key,count,globalDelay){
  const color=CATS[key].color;
  const n=birdN(count);
  let birds='',dots='',d=globalDelay;
  for(let i=0;i<10;i++){
    const p=PERCHES[i];
    if(i<n){birds+=makeBird(p.x,p.y,color,d,i%3===0);d+=0.11;}
    else{dots+=makePerch(p.x,p.y);}
  }
  const sw=(5.5+Math.random()).toFixed(1);
  const sd=(Math.random()*4).toFixed(1);
  const svg=`<svg viewBox="0 0 260 295" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sk${key}" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#cce0f4"/><stop offset="100%" stop-color="#ede4d0"/>
</linearGradient>
<filter id="lf${key}" x="-15%" y="-15%" width="130%" height="130%">
<feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,50,0,.14)"/>
</filter>
</defs>
<rect width="260" height="295" fill="url(#sk${key})"/>
<ellipse cx="130" cy="284" rx="108" ry="14" fill="#c2ac74" opacity=".3"/>
<path d="M130,288 C128,263 126,236 127,214 C128,197 130,182 130,168" stroke="#7c4e2c" stroke-width="20" fill="none" stroke-linecap="round"/>
<path d="M129,182 C110,179 87,169 63,155 C42,143 25,130 12,115" stroke="#7c4e2c" stroke-width="11" fill="none" stroke-linecap="round"/>
<path d="M131,178 C152,175 175,165 198,151 C219,139 236,127 248,113" stroke="#7c4e2c" stroke-width="11" fill="none" stroke-linecap="round"/>
<path d="M74,160 C60,147 46,133 36,119" stroke="#7c4e2c" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M186,157 C200,144 212,131 222,117" stroke="#7c4e2c" stroke-width="7" fill="none" stroke-linecap="round"/>
<g style="transform-origin:130px 288px;animation:sway ${sw}s ease-in-out infinite -${sd}s" filter="url(#lf${key})">
<ellipse cx="130" cy="92"  rx="94"  ry="74"  fill="#3c6c33" opacity=".91"/>
<ellipse cx="88"  cy="112" rx="66"  ry="53"  fill="#4d8840" opacity=".87"/>
<ellipse cx="172" cy="110" rx="66"  ry="53"  fill="#4d8840" opacity=".87"/>
<ellipse cx="36"  cy="117" rx="52"  ry="44"  fill="#3c6c33" opacity=".88"/>
<ellipse cx="224" cy="114" rx="52"  ry="44"  fill="#3c6c33" opacity=".88"/>
<ellipse cx="130" cy="74"  rx="70"  ry="55"  fill="#5a9848" opacity=".78"/>
<ellipse cx="130" cy="57"  rx="44"  ry="35"  fill="#70b055" opacity=".43"/>
</g>
<g>${dots}</g>
<g>${birds}</g>
</svg>`;
  return{svg,delay:d};
}

function render(data){
  const grid=document.getElementById('tree-grid');
  grid.innerHTML='';
  let delay=0,totalBirds=0,totalCnt=0;
  for(const[key,cfg]of Object.entries(CATS)){
    const cnt=(data[key]||{}).count||0;
    const n=birdN(cnt);
    totalCnt+=cnt;totalBirds+=n;
    const res=buildTree(key,cnt,delay);
    delay=res.delay;
    const card=document.createElement('div');
    card.className='tree-card';
    card.innerHTML=`${res.svg}
<div class="tree-info">
  <div class="t-dot" style="background:${cfg.color}"></div>
  <div>
    <div class="t-name">${cfg.name}</div>
    <div class="t-cnt">${cnt.toLocaleString()}켤레 · ${n}마리</div>
  </div>
</div>`;
    grid.appendChild(card);
  }
  const anim=(el,target)=>{
    const t0=performance.now(),dur=1400;
    const tick=now=>{const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=Math.floor(e*target).toLocaleString();if(p<1)requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  };
  anim(document.getElementById('total-cnt'),totalCnt);
  anim(document.getElementById('total-birds'),totalBirds);
}

function copyLink(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const b=document.getElementById('share-btn');
    b.textContent='✓  복사되었습니다!';b.classList.add('ok');
    setTimeout(()=>{b.textContent='🔗 \u00a0 링크 복사해서 공유하기';b.classList.remove('ok');},2200);
  });
}

async function load(){
  let data={cat1:{count:0},cat2:{count:0},cat3:{count:0},cat4:{count:0}};
  try{
    const r=await fetch(API);
    const j=await r.json();
    if(j.success){data={};for(const[k,v]of Object.entries(j.data))data[k]={count:v.count||0};}
  }catch(e){console.warn('API 실패');}
  render(data);
}
load();
</script>
</body>
</html>
