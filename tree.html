<!DOCTYPE html>
<html lang="ko">
<head>

<title>JJTT 기부 나무</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f5f0e8;font-family:'Noto Sans KR',sans-serif}
.page{max-width:960px;margin:0 auto;padding:24px 16px 48px}

.hd{text-align:center;margin-bottom:16px}
.hd-tag{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3em;color:#8a6a2a;border:1px solid rgba(138,106,42,.3);padding:5px 14px;margin-bottom:10px}
.hd-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.05em;color:#2a2018}
.hd-sub{font-size:12px;color:rgba(42,32,24,.48);margin-top:5px;letter-spacing:.03em}

.scene{background:white;border-radius:16px;overflow:hidden;box-shadow:0 6px 32px rgba(0,0,0,.1)}
#sv{width:100%;display:block}

.total-bar{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:14px;font-family:'DM Mono',monospace;font-size:11px;color:rgba(42,32,24,.5);letter-spacing:.08em}
.total-bar strong{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#2a2018;letter-spacing:.03em}

.share-btn{display:block;width:100%;margin-top:12px;padding:12px;background:white;border:1px solid rgba(138,106,42,.2);border-radius:10px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:#8a6a2a;cursor:pointer;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:background .2s}
.share-btn:hover{background:#faf8f2}
.share-btn.ok{background:#f0f8ec;color:#4a7a30;border-color:rgba(74,122,48,.3)}
.ft{text-align:center;margin-top:16px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:rgba(42,32,24,.28)}

@keyframes flyInL{0%{opacity:0;transform:translate(-50px,24px) scale(.48)}65%{opacity:1;transform:translate(3px,-3px) scale(1.05)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes flyInR{0%{opacity:0;transform:translate(50px,24px) scale(.48)}65%{opacity:1;transform:translate(-3px,-3px) scale(1.05)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes flyInT{0%{opacity:0;transform:translate(0,-46px) scale(.48)}65%{opacity:1;transform:translate(0,4px) scale(1.05)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

.bird-g{animation-duration:.88s;animation-timing-function:cubic-bezier(.34,1.56,.64,1);animation-fill-mode:both}
.fl{animation-name:flyInL}
.fr{animation-name:flyInR}
.ft2{animation-name:flyInT}
.bird-bd{animation:bob var(--bd,3s) ease-in-out infinite var(--dd,0s)}
</style>
</head>

<script>
const API='https://jjtt-webhook.vercel.app/api/status';

// Natural bird color palette (not category-coded)
const PAL=[
  '#c05020','#5878a0','#789030','#d07820',
  '#b84868','#286878','#b09018','#884898',
  '#886028','#488448','#a03820','#504898',
  '#c87840','#306858','#a06028','#485890'
];

// Perch positions per category (on/near branches in 920x520 space)
const PERCHES={
  cat1:[
    {x:80,y:278},{x:59,y:258},{x:40,y:239},{x:24,y:221},{x:8,y:203},
    {x:147,y:276},{x:167,y:256},{x:185,y:237},{x:201,y:219},{x:215,y:202}
  ],
  cat2:[
    {x:258,y:308},{x:228,y:292},{x:200,y:278},{x:174,y:265},{x:150,y:252},
    {x:386,y:305},{x:416,y:289},{x:444,y:274},{x:470,y:260},{x:492,y:247}
  ],
  cat3:[
    {x:505,y:275},{x:483,y:261},{x:463,y:247},{x:446,y:235},
    {x:598,y:267},{x:628,y:251},{x:657,y:237},{x:683,y:223},{x:707,y:210},
    {x:540,y:290}
  ],
  cat4:[
    {x:716,y:273},{x:694,y:256},{x:674,y:241},{x:656,y:227},{x:641,y:215},
    {x:806,y:270},{x:828,y:254},{x:848,y:240},{x:865,y:227},{x:880,y:215}
  ]
};

const LB_IDS={cat1:'lb1',cat2:'lb2',cat3:'lb3',cat4:'lb4'};

function birdN(n){return Math.min(10,Math.floor(n/10));}
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)];}

// 3 bird body types for variety
function bodyPaths(type, color){
  if(type==='B') return `
<path d="M-16,2 L-26,-2 L-24,6Z" fill="${color}" opacity=".80"/>
<ellipse cx="0" cy="0" rx="11" ry="7" fill="${color}"/>
<circle cx="13" cy="-5" r="7" fill="${color}"/>
<path d="M18,-4.5 L25,-3 L18,-1.5Z" fill="#8B5E3C"/>
<circle cx="14.5" cy="-6.5" r="2" fill="white"/>
<circle cx="15" cy="-6.8" r="1" fill="#111"/>
<path d="M-5,-4 Q3,-13 11,-4" stroke="rgba(255,255,255,.28)" stroke-width="1.8" fill="none"/>
<path d="M-1,7 L-3,13 M-1,7 L1,13" stroke="#8B5E3C" stroke-width="1.3" fill="none" stroke-linecap="round"/>
<path d="M3,7 L1,13 M3,7 L5,13" stroke="#8B5E3C" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  if(type==='C') return `
<path d="M-13,4 L-21,-2 L-20,8Z" fill="${color}" opacity=".83"/>
<ellipse cx="0" cy="0" rx="15" ry="11" fill="${color}"/>
<circle cx="16" cy="-6" r="9" fill="${color}"/>
<path d="M22,-5.5 L29,-4 L22,-2.5Z" fill="#8B5E3C"/>
<circle cx="17.5" cy="-7.5" r="2.5" fill="white"/>
<circle cx="18" cy="-7.8" r="1.2" fill="#111"/>
<circle cx="18.8" cy="-8.4" r=".5" fill="white"/>
<path d="M-3,-6 Q5,-16 14,-6" stroke="rgba(255,255,255,.26)" stroke-width="2.2" fill="none"/>
<path d="M-1,11 L-3,17 M-1,11 L1,17" stroke="#8B5E3C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M4,11 L2,17 M4,11 L6,17" stroke="#8B5E3C" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  return `
<path d="M-14,3 L-23,-2 L-21,7Z" fill="${color}" opacity=".82"/>
<ellipse cx="0" cy="0" rx="13" ry="9" fill="${color}"/>
<circle cx="14" cy="-6" r="8" fill="${color}"/>
<path d="M20,-5.5 L27,-4 L20,-2.5Z" fill="#8B5E3C"/>
<circle cx="15.5" cy="-7.5" r="2.2" fill="white"/>
<circle cx="16" cy="-7.8" r="1.1" fill="#111"/>
<circle cx="16.8" cy="-8.4" r=".5" fill="white"/>
<path d="M-4,-5 Q4,-14 12,-5" stroke="rgba(255,255,255,.3)" stroke-width="2" fill="none"/>
<path d="M-1,9 L-3,15 M-1,9 L1,15" stroke="#8B5E3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<path d="M3,9 L1,15 M3,9 L5,15" stroke="#8B5E3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
}

function makeBird(x,y,delay){
  const color=rnd(PAL);
  const type=rnd(['A','A','B','C']); // A more common
  const s=(0.52+Math.random()*0.18).toFixed(2);
  const flip=Math.random()>.5;
  const fx=flip?-1:1;
  const dir=rnd(['fl','fl','fr','ft2']); // mostly fly from left
  const yOff=Math.round(15*s);
  const bd=(2.2+Math.random()*2.2).toFixed(1);
  const dd=(Math.random()*1.8).toFixed(1);
  return `<g class="bird-g ${dir}" style="animation-delay:${delay}s">
<g transform="translate(${x},${y-yOff}) scale(${fx*s},${s})">
<g class="bird-bd" style="--bd:${bd}s;--dd:${dd}s">
${bodyPaths(type,color)}
</g></g></g>`;
}

function makePerch(x,y){
  return `<circle cx="${x}" cy="${y-3}" r="3" fill="none" stroke="#9a8060" stroke-width=".8" opacity=".18"/>`;
}

function render(data){
  let birds='', dots='', delay=0, totalBirds=0, totalCnt=0;

  for(const[key,perches]of Object.entries(PERCHES)){
    const cnt=(data[key]||{}).count||0;
    const n=birdN(cnt);
    totalCnt+=cnt; totalBirds+=n;

    // Update label
    const lbEl=document.getElementById(LB_IDS[key]);
    if(lbEl)lbEl.textContent=`${cnt.toLocaleString()}켤레 · ${n}마리`;

    for(let i=0;i<10;i++){
      const p=perches[i];
      if(i<n){birds+=makeBird(p.x,p.y,delay);delay+=0.10;}
      else    {dots+=makePerch(p.x,p.y);}
    }
  }

  document.getElementById('birds').innerHTML=birds;
  document.getElementById('dots').innerHTML=dots;

  const anim=(el,target)=>{
    const t0=performance.now(),dur=1500;
    const tick=now=>{
      const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);
      el.textContent=Math.floor(e*target).toLocaleString();
      if(p<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  anim(document.getElementById('total-cnt'),totalCnt);
  anim(document.getElementById('total-birds'),totalBirds);
}

function copyLink(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const b=document.getElementById('share-btn');
    b.textContent='✓  복사되었습니다!';b.classList.add('ok');
    setTimeout(()=>{b.textContent='🔗 \u00a0 링크 복사해서 공유하기';b.classList.remove('ok');},2200);
  });
}

async function load(){
  let data={cat1:{count:0},cat2:{count:0},cat3:{count:0},cat4:{count:0}};
  try{
    const r=await fetch(API);
    const j=await r.json();
    if(j.success){data={};for(const[k,v]of Object.entries(j.data))data[k]={count:v.count||0};}
  }catch(e){console.warn('API 실패');}
  render(data);
}
load();
</script>
